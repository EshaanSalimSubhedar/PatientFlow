services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: patientflow
      POSTGRES_USER: patientflow
      POSTGRES_PASSWORD: patientflow_dev
    ports: ["5432:5432"]
    volumes: [patientflow-data:/var/lib/postgresql/data]
  backend:
    build: ./backend-springboot
    environment:
      CAMUNDA_CLIENT_GRPC_ADDRESS: ${CAMUNDA_CLIENT_GRPC_ADDRESS:-http://host.docker.internal:26500}
      CAMUNDA_CLIENT_REST_ADDRESS: ${CAMUNDA_CLIENT_REST_ADDRESS:-http://host.docker.internal:8080}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/patientflow
      SPRING_DATASOURCE_DRIVER: org.postgresql.Driver
      SPRING_DATASOURCE_USERNAME: patientflow
      SPRING_DATASOURCE_PASSWORD: patientflow_dev
    depends_on: [postgres]
    ports: ["8082:8082"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  frontend:
    build: ./frontend-react
    ports: ["5173:80"]
    depends_on: [backend]
volumes:
  patientflow-data:
